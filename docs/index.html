<title>Contribution Terrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #00000f;
    --ink: #e8ecff;
    --muted: #7a86ad;
    --line: rgba(122, 134, 173, 0.28);
    --chip: rgba(10, 16, 42, 0.72);
    --gold: #ffc837;
    --blue: #1996e6;
    --display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    overflow: hidden;
  }
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    touch-action: none;
    outline: none;
  }
  #scene.dragging { cursor: grabbing; }
  #scene.hovering { cursor: pointer; }
  #scene:focus-visible { box-shadow: inset 0 0 0 2px var(--gold); }

  header {
    position: fixed;
    top: clamp(14px, 3vh, 28px);
    left: clamp(16px, 3vw, 32px);
    pointer-events: none;
    z-index: 3;
  }
  header h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(1.15rem, 2.6vw, 1.6rem);
    letter-spacing: 0.04em;
    text-wrap: balance;
  }
  header p {
    margin: 0.3em 0 0;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  header a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    pointer-events: auto;
  }
  header a:hover, header a:focus-visible { color: var(--gold); border-color: var(--gold); outline: none; }

  #hint {
    position: fixed;
    top: clamp(14px, 3vh, 28px);
    right: clamp(16px, 3vw, 32px);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    z-index: 3;
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #hint.gone { opacity: 0; }

  #stats {
    position: fixed;
    left: 50%;
    bottom: clamp(14px, 3.5vh, 30px);
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: min(94vw, 760px);
    z-index: 3;
    pointer-events: none;
  }
  .chip {
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 14px 9px;
    min-width: 96px;
    backdrop-filter: blur(6px);
  }
  .chip .label {
    display: block;
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
    white-space: nowrap;
  }
  .chip .value {
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.15rem;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .chip .sub {
    font-size: 0.62rem;
    color: var(--muted);
    margin-left: 5px;
    letter-spacing: 0.02em;
  }

  #tip {
    position: fixed;
    z-index: 4;
    background: var(--chip);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 12px 10px;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.12s ease;
    backdrop-filter: blur(6px);
    max-width: 240px;
  }
  #tip.on { opacity: 1; visibility: visible; }
  #tip.pinned { pointer-events: auto; }
  #tip .count {
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
  }
  #tip .count b { color: var(--gold); font-weight: 600; }
  #tip .date {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.04em;
  }
  #tip .brk {
    display: grid;
    gap: 3px;
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid var(--line);
    font-size: 0.66rem;
    letter-spacing: 0.02em;
  }
  #tip .brk:empty { display: none; }
  #tip .brk .row { display: flex; gap: 5px; white-space: nowrap; }
  #tip .brk .in, #tip .brk .more { color: var(--muted); }
  #tip .brk .repo { color: var(--blue); }
  #tip .go {
    display: block;
    margin-top: 6px;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--blue);
    text-decoration: none;
  }
  #tip .go:hover, #tip .go:focus-visible { color: var(--gold); outline: none; }

  @media (prefers-reduced-motion: reduce) {
    #hint { transition: none; }
    #tip { transition: none; }
  }
</style>

<canvas id="scene" tabindex="0"
  aria-label="Rotatable 3D graph of daily GitHub contributions. Use arrow keys to move between days, Enter to open that day's activity."></canvas>

</div>

  const maxCount = Math.max(1, ...bars.map(b => b.count));

  /* ---- stats (all computed) ---- */
  const total = bars.reduce((s, b) => s + b.count, 0);
  const busiest = bars.reduce((a, b) => (b.count > a.count ? b : a));
  let longest = 0, current = 0, run = 0;
  for (const b of bars) { run = b.count > 0 ? run + 1 : 0; longest = Math.max(longest, run); }
  for (let i = bars.length - 1; i >= 0; i--) {
    if (bars[i].count > 0) current++;
    else if (i === bars.length - 1) continue; /* today can still be 0 */
    else break;
  }
  const dayWord = n => (n === 1 ? "day" : "days");
  document.getElementById("stats").innerHTML = [
    ["contributions", total.toLocaleString(), "past year"],
    ["busiest day", busiest.count, fmtShort(busiest.date)],
    ["current streak", current, dayWord(current)],
    ["longest streak", longest, dayWord(longest)],
  ].map(([l, v, s]) =>
    `<div class="chip"><span class="label">${l}</span><span class="value">${v}</span><span class="sub">${s}</span></div>`
  ).join("");

  /* ---- month + weekday labels, derived from the data ---- */
  const monthLabels = [];
  let lastMonth = -1;
  for (const b of bars) {
    const dt = new Date(b.date + "T00:00:00");
    if (dt.getMonth() !== lastMonth) {
      lastMonth = dt.getMonth();
      if (b.col > 0 && b.col < COLS - 2)
        monthLabels.push({ col: b.col, text: dt.toLocaleDateString(undefined, { month: "short" }) });
    }
  }
  const WD = [1, 3, 5].map(i => ({
    row: i,
    text: new Date(2026, 2, 1 + i).toLocaleDateString(undefined, { weekday: "short" }),
  }));

  /* ---- stars: seeded, stable across frames ---- */
  const rng = (s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296)(20260831);
  const stars = Array.from({ length: 150 }, () => ({
    x: rng(), y: rng() * 0.82, r: 0.4 + rng() * 1.1, p: rng() * Math.PI * 2, tw: 0.3 + rng() * 0.7,
  }));

  /* ---- camera ---- */
  let yaw = -0.65, pitch = 0.62, zoom = 1;
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", () => { resize(); draw(); });
  resize();

  const shade = (c, f) => `rgb(${(c[0] * f) | 0},${(c[1] * f) | 0},${(c[2] * f) | 0})`;

  /* ---- interaction state ---- */
  let hovered = -1, pinnedBar = -1, keyBar = -1;
  let dragging = false, moved = false, lastX = 0, lastY = 0;
  let idleAt = performance.now(), started = performance.now();
  let pinch = null;

  function project() {
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const base = Math.min(W / (COLS + 14), H / ((COLS + 14) * 0.55)) * zoom;
    const cell = base, gap = base * 0.14;
    const maxH = base * 8;
    const ox = W / 2, oy = H * 0.52;
    const p3 = (x, y, z) => {
      const xr = x * cy + y * sy, yr = -x * sy + y * cy;
      return [ox + xr * cell, oy + yr * cell * sp - z * cp, yr];
    };
    return { p3, cell, gap, maxH };
  }

  const now = () => performance.now();

  function draw() {
    const t = now();
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);

    /* stars */
    for (const s of stars) {
      const a = reduceMotion ? 0.7 : 0.45 + 0.45 * Math.sin(t / 1400 * s.tw + s.p);
      ctx.globalAlpha = Math.max(0.08, a) * 0.85;
      ctx.fillStyle = "#eeeeff";
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, 7);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const { p3, cell, gap, maxH } = project();
    const half = (cell - gap) / 2;
    const cx0 = COLS / 2, cy0 = 3.5;

    /* ground plane */
    const g = [
      p3(-cx0 - 1.2, -cy0 - 1.2, 0), p3(cx0 + 1.2, -cy0 - 1.2, 0),
      p3(cx0 + 1.2, cy0 + 1.2, 0), p3(-cx0 - 1.2, cy0 + 1.2, 0),
    ];
    ctx.beginPath();
    g.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
    ctx.closePath();
    ctx.fillStyle = "rgba(25,60,130,0.10)";
    ctx.strokeStyle = "rgba(25,120,220,0.30)";
    ctx.lineWidth = 1;
    ctx.fill();
    ctx.stroke();

    /* grow-in animation */
    const growFor = i => {
      if (reduceMotion) return 1;
      const e = (t - started - (i / bars.length) * 900) / 650;
      return e <= 0 ? 0 : e >= 1 ? 1 : 1 - Math.pow(1 - e, 3);
    };

    /* build faces */
    const faces = [];
    for (let i = 0; i < bars.length; i++) {
      const b = bars[i];
      const x = b.col - cx0 + 0.5, y = b.row - cy0;
      const h = Math.max(0.035, b.count / maxCount) * maxH * growFor(i);
      const c = [x - half / cell, x + half / cell], r = [y - half / cell, y + half / cell];
      const P = [
        p3(c[0], r[0], 0), p3(c[1], r[0], 0), p3(c[1], r[1], 0), p3(c[0], r[1], 0),
        p3(c[0], r[0], h), p3(c[1], r[0], h), p3(c[1], r[1], h), p3(c[0], r[1], h),
      ];
      const depth = (P[0][2] + P[2][2]) / 2;
      const isToday = i === bars.length - 1;
      const active = i === hovered || i === pinnedBar || i === keyBar;
      const top = active ? GOLD : isToday ? GOLD : RAMP[b.level];
      const quad = (a, b2, c2, d, f, isTop) =>
        faces.push({ pts: [P[a], P[b2], P[c2], P[d]], f, top: isTop, color: top, i, depth });
      quad(4, 5, 6, 7, 1, true);
      quad(0, 1, 5, 4, 0.62, false);
      quad(1, 2, 6, 5, 0.8, false);
      quad(2, 3, 7, 6, 0.62, false);
      quad(3, 0, 4, 7, 0.8, false);
    }
    faces.sort((a, b) => a.depth - b.depth || a.top - b.top);

    const paintOrder = [];
    for (const f of faces) {
      const p = f.pts;
      const area = (p[1][0] - p[0][0]) * (p[2][1] - p[0][1]) - (p[2][0] - p[0][0]) * (p[1][1] - p[0][1]);
      if (area >= 0 && !f.top) continue; /* cull back side faces */
      ctx.beginPath();
      ctx.moveTo(p[0][0], p[0][1]);
      ctx.lineTo(p[1][0], p[1][1]);
      ctx.lineTo(p[2][0], p[2][1]);
      ctx.lineTo(p[3][0], p[3][1]);
      ctx.closePath();
      const active = f.i === hovered || f.i === pinnedBar || f.i === keyBar;
      const isTodayTop = f.top && f.i === bars.length - 1 && !active;
      let alpha = 1;
      if (isTodayTop && !reduceMotion) alpha = 0.75 + 0.25 * Math.sin(t / 350);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = shade(f.color, f.f);
      ctx.fill();
      if (f.top && active) {
        ctx.strokeStyle = "#ffc837";
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      paintOrder.push(f);
    }

    /* labels */
    ctx.fillStyle = "rgba(122,134,173,0.9)";
    ctx.font = `${Math.max(9, cell * 0.9)}px ${getComputedStyle(document.body).getPropertyValue("--mono")}`;
    ctx.textAlign = "center";
    for (const m of monthLabels) {
      const p = p3(m.col - cx0 + 0.5, cy0 + 1.6, 0);
      ctx.fillText(m.text, p[0], p[1]);
    }
    for (const w of WD) {
      const p = p3(-cx0 - 1.6, w.row - cy0, 0);
      ctx.fillText(w.text, p[0], p[1]);
    }

    return paintOrder;
  }

  /* ---- hit testing ---- */
  let lastPaint = [];
  function pick(mx, my) {
    for (let i = lastPaint.length - 1; i >= 0; i--) {
      const f = lastPaint[i], p = f.pts;
      let inside = false;
      for (let a = 0, b = 3; a < 4; b = a++) {
        if (((p[a][1] > my) !== (p[b][1] > my)) &&
            (mx < (p[b][0] - p[a][0]) * (my - p[a][1]) / (p[b][1] - p[a][1]) + p[a][0]))
          inside = !inside;
      }
      if (inside) return f.i;
    }
    return -1;
  }

  /* ---- tooltip ---- */
  const tipN = document.getElementById("tip-n");
  const tipW = document.getElementById("tip-word");
  const tipD = document.getElementById("tip-d");
  const tipB = document.getElementById("tip-b");
  const tipA = document.getElementById("tip-a");

  const word = (n, s) => `${n} ${s}${n === 1 ? "" : "s"}`;
  const row = (what, repo) =>
    `<div class="row"><span>${what}</span><span class="in">in</span><span class="repo">${repo}</span></div>`;

  function breakdown(b) {
    const d = b.d;
    if (!d) return "";
    const lines = [];
    for (const [repo, n] of d.c || []) lines.push(row(word(n, "commit"), repo));
    for (const [repo, n] of d.p || []) lines.push(row(word(n, "pull request"), repo));
    for (const [repo, n] of d.i || []) lines.push(row(word(n, "issue"), repo));
    for (const [repo, n] of d.r || []) lines.push(row(word(n, "review"), repo));
    let html = lines.slice(0, 6).join("");
    if (lines.length > 6) html += `<div class="row more">+${lines.length - 6} more</div>`;
    if (d.x) html += row(word(d.x, "contribution"), "private repos");
    return html;
  }

  function showTip(i, x, y, pin) {
    const b = bars[i];
    tipN.textContent = b.count;
    tipW.textContent = b.count === 1 ? "contribution" : "contributions";
    tipD.textContent = fmt(b.date);
    tipB.innerHTML = breakdown(b);
    tipA.href = `https://github.com/${user}?tab=overview&from=${b.date}&to=${b.date}`;
    tip.classList.add("on");
    tip.classList.toggle("pinned", !!pin);
    const r = tip.getBoundingClientRect();
    let tx = x + 16, ty = y - r.height - 12;
    if (tx + r.width > W - 8) tx = x - r.width - 16;
    if (ty < 8) ty = y + 18;
    tip.style.left = tx + "px";
    tip.style.top = ty + "px";
  }
  const hideTip = () => { tip.classList.remove("on", "pinned"); };

  /* ---- pointer events ---- */
  const pointers = new Map();

  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = Math.hypot(a[0] - b[0], a[1] - b[1]);
    } else {
      dragging = true; moved = false;
      lastX = e.clientX; lastY = e.clientY;
      canvas.classList.add("dragging");
    }
    idleAt = now();
  });

  canvas.addEventListener("pointermove", e => {
    idleAt = now();
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 2 && pinch) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoom = Math.min(3, Math.max(0.5, zoom * d / pinch));
      pinch = d;
      return;
    }
    if (dragging) {
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      yaw += dx * 0.006;
      pitch = Math.min(1.35, Math.max(0.2, pitch + dy * 0.004));
      lastX = e.clientX; lastY = e.clientY;
      hint.classList.add("gone");
      return;
    }
    if (e.pointerType === "mouse") {
      const h = pick(e.clientX, e.clientY);
      hovered = h;
      keyBar = -1; pinnedBar = -1;
      canvas.classList.toggle("hovering", h >= 0);
      if (h >= 0) showTip(h, e.clientX, e.clientY, false);
      else hideTip();
    }
  });

  const endPointer = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove("dragging");
    if (!moved) {
      const h = pick(e.clientX, e.clientY);
      if (h >= 0) {
        if (e.pointerType === "mouse") {
          open(`https://github.com/${user}?tab=overview&from=${bars[h].date}&to=${bars[h].date}`, "_blank");
        } else {
          pinnedBar = h;
          showTip(h, e.clientX, e.clientY, true);
        }
      } else { pinnedBar = -1; hideTip(); }
    }
  };
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("pointerleave", () => {
    if (!dragging) { hovered = -1; canvas.classList.remove("hovering"); if (pinnedBar < 0) hideTip(); }
  });

  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    idleAt = now();
    zoom = Math.min(3, Math.max(0.5, zoom * (e.deltaY < 0 ? 1.08 : 0.92)));
    hint.classList.add("gone");
  }, { passive: false });

  /* ---- keyboard: arrows walk days, Enter opens ---- */
  canvas.addEventListener("keydown", e => {
    const step = { ArrowLeft: -7, ArrowRight: 7, ArrowUp: -1, ArrowDown: 1 }[e.key];
    if (step !== undefined) {
      e.preventDefault();
      idleAt = now();
      keyBar = keyBar < 0 ? bars.length - 1 : Math.min(bars.length - 1, Math.max(0, keyBar + step));
      hovered = -1; pinnedBar = -1;
      const b = bars[keyBar];
      const { p3 } = project();
      const p = p3(b.col - COLS / 2 + 0.5, b.row - 3.5, 0);
      showTip(keyBar, p[0], p[1], true);
    } else if (e.key === "Enter" && keyBar >= 0) {
      open(`https://github.com/${user}?tab=overview&from=${bars[keyBar].date}&to=${bars[keyBar].date}`, "_blank");
    } else if (e.key === "Escape") {
      keyBar = -1; pinnedBar = -1; hideTip();
    }
  });
  canvas.addEventListener("blur", () => { keyBar = -1; if (pinnedBar < 0) hideTip(); });

  setTimeout(() => hint.classList.add("gone"), 6000);

  /* ---- main loop: idle drift + render ---- */
  function frame() {
    if (!reduceMotion && !dragging && hovered < 0 && pinnedBar < 0 && keyBar < 0 &&
        now() - idleAt > 5000) {
      yaw += 0.0012;
    }
    lastPaint = draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
