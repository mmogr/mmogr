name: Profile
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
jobs:
  graphics:
    runs-on: ubuntu-latest
    name: generate-profile-graphics
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: transparent
          UTC_OFFSET: 10
          AUTO_PUSH: false
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generate profile graphics" || echo "no changes"
          git push
  pages:
    runs-on: ubuntu-latest
    name: deploy-contribution-terrain
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          TZ_NAME: Australia/Brisbane
        run: |
          mkdir -p _site
          cp docs/index.html _site/
          OUT=_site/contribs.json python3 .github/scripts/contribs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
