name: Profile
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
jobs:
  graphics:
    runs-on: ubuntu-latest
    name: generate-profile-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Render profile cards + README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          TZ_NAME: Australia/Brisbane
        run: python3 .github/scripts/render_profile_cards.py
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generate profile cards" || echo "no changes"
          git pull --rebase origin main
          git push
  pages:
    runs-on: ubuntu-latest
    name: deploy-contribution-terrain
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          TZ_NAME: Australia/Brisbane
        run: |
          mkdir -p _site
          cp docs/index.html _site/
          OUT=_site/contribs.json python3 .github/scripts/contribs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
