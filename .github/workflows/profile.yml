# Publishes contribs.json to mmogr.github.io/mmogr/ nightly — the data feed
# behind mattogrady.com's contribution terrain, language tints and planets.
# The profile-card graphics that used to be rendered here are retired: this
# repository no longer carries a README, so the profile shows nothing but
# the repositories and the calendar.
name: Profile
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
jobs:
  pages:
    runs-on: ubuntu-latest
    name: publish-data-feed
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          # CONTRIB_PAT (optional, classic PAT with repo scope) lets the feed
          # see private repos so it can publish per-day LANGUAGE buckets —
          # names never leave the script either way
          GH_TOKEN: ${{ secrets.CONTRIB_PAT || secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          TZ_NAME: Australia/Brisbane
        run: |
          mkdir -p _site
          OUT=_site/contribs.json python3 .github/scripts/contribs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
