name: Diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect CONTRIB_PAT capabilities
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_PAT }}
        run: |
          echo "token present: $([ -n "$GH_TOKEN" ] && echo yes || echo NO)"
          echo "token prefix: $(echo "$GH_TOKEN" | cut -c1-4)"
          gh api -i user 2>/dev/null | grep -i "x-oauth-scopes" || echo "no scopes header (fine-grained token)"
          gh api graphql -f query='query{viewer{login repositories(privacy:PRIVATE,ownerAffiliations:OWNER){totalCount}}}' --jq '"login: " + .data.viewer.login + " | private repos visible: " + (.data.viewer.repositories.totalCount|tostring)'
